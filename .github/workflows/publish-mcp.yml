name: Publish MCP listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download verified publisher
        shell: bash
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Check production authorization discovery
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          with open("server.json") as source:
              endpoint = json.load(source)["remotes"][0]["url"]

          resource = urllib.parse.urlsplit(endpoint)
          assert resource.scheme == "https"
          origin = f"{resource.scheme}://{resource.netloc}"
          resource_metadata_url = origin + "/.well-known/oauth-protected-resource" + resource.path

          request = urllib.request.Request(
              endpoint,
              data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json, text/event-stream"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30):
                  raise AssertionError("Unauthenticated MCP access must be rejected")
          except urllib.error.HTTPError as error:
              assert error.code == 401, f"Expected 401, received {error.code}"
              challenge = error.headers.get("WWW-Authenticate", "")
              assert challenge.startswith("Bearer "), "Missing Bearer challenge"
              assert f'resource_metadata="{resource_metadata_url}"' in challenge

          with urllib.request.urlopen(resource_metadata_url, timeout=30) as response:
              metadata = json.load(response)
          assert metadata["resource"] == endpoint
          assert "catalog:read" in metadata["scopes_supported"]
          assert "header" in metadata["bearer_methods_supported"]
          assert len(metadata["authorization_servers"]) == 1
          issuer = metadata["authorization_servers"][0]
          issuer_parts = urllib.parse.urlsplit(issuer)
          assert issuer_parts.scheme == "https" and issuer_parts.netloc == resource.netloc
          discovery_url = origin + "/.well-known/oauth-authorization-server" + issuer_parts.path
          with urllib.request.urlopen(discovery_url, timeout=30) as response:
              discovery = json.load(response)
          assert discovery["issuer"] == issuer
          assert "catalog:read" in discovery["scopes_supported"]
          assert "offline_access" in discovery["scopes_supported"]
          assert "authorization_code" in discovery["grant_types_supported"]
          assert "refresh_token" in discovery["grant_types_supported"]
          assert "S256" in discovery["code_challenge_methods_supported"]
          for field in ["authorization_endpoint", "token_endpoint", "jwks_uri"]:
              target = urllib.parse.urlsplit(discovery[field])
              assert target.scheme == "https" and target.netloc == resource.netloc, field
          print("Anonymous access rejected; resource and OAuth discovery verified. Authenticated tool execution requires a separate authorized client.")
      - name: Validate listing
        run: ./mcp-publisher validate
      - name: Authenticate with GitHub identity
        run: ./mcp-publisher login github-oidc
      - name: Publish listing
        run: ./mcp-publisher publish
