name: Publish MCP listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download verified publisher
        shell: bash
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Check production connector
        shell: python
        run: |
          import json
          import urllib.request

          with open("server.json") as source:
              endpoint = json.load(source)["remotes"][0]["url"]

          def call(method, params):
              body = {"jsonrpc": "2.0", "id": 1, "method": method, "params": params}
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json", "Accept": "application/json, text/event-stream"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert "error" not in result, result
              return result["result"]

          tools = call("tools/list", {})["tools"]
          assert len(tools) == 3
          assert all(tool["annotations"]["readOnlyHint"] is True for tool in tools)
          workout = call("tools/call", {"name": "get_workout", "arguments": {"workout": "Fran"}})
          assert not workout.get("isError"), workout
          data = workout["structuredContent"]
          assert data["name"] == "Fran"
          assert data["url"].startswith("https://przilla.app/wod/fran?")
          assert data["movements"] and data["levels"]
          print("Three read-only tools discovered; Fran lookup verified.")
      - name: Validate listing
        run: ./mcp-publisher validate
      - name: Authenticate with GitHub identity
        run: ./mcp-publisher login github-oidc
      - name: Publish listing
        run: ./mcp-publisher publish
